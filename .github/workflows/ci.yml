# CI (D-12, D-34). Two tiers, both built on `pnpm run ci` (scripts/ci.mjs, docs/DEV.md "CI"):
# - `fast`: the `pnpm run ci --fast` steps split over parallel jobs. Runs on every PR and push; the PR gate
#   (< 3 min wall clock).
# - `checks`: the full `pnpm run ci` (compose stack, migrate, test:int, Playwright e2e; ~15 min). Runs on pushes
#   to main and on demand (Actions → CI → Run workflow, any branch) — not on PRs.
# No secrets: every external dependency is the compose stack (D-11), started by the `stack` step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # The 4-vCPU runner is several times slower than a dev machine: stretch timeouts, never the waits.
  OAT_TEST_TIMEOUT_SCALE: '3'
  E2E_TIMEOUT_SCALE: '2'

jobs:
  fast:
    name: Fast (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Balanced by cold-cache timings: typecheck and unit tests are ~60-75 s each, the rest ~50 s together.
      matrix:
        include:
          - name: format, actionlint, lint
            key: static
            steps: format,actionlint,lint
          - name: typecheck
            key: typecheck
            steps: typecheck
          - name: unit tests
            key: test
            steps: test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.key }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.key }}-

      - name: pnpm run ci --only ${{ matrix.steps }}
        run: pnpm run ci --only ${{ matrix.steps }}

      - name: Save turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  checks:
    name: Checks (Linux)
    # Not on PRs (D-34): ~15 min, dominated by e2e (8-16 min) and test:int (~3.5 min).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore/save are split so a failing run still saves the caches (actions/cache only saves on success).
      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-full-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-full-

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Browser only, no `--with-deps`: ubuntu-24.04 already ships every library Chromium needs. The apt step
      # only added optional CJK/Unicode fonts and mesa upgrades, at ~8 min over a slow mirror.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @oat/ui exec playwright install chromium

      # Everything except the Swift steps (macOS only; they report `skip` here). The `stack` step runs
      # `pnpm dev:up`: builds the local images and starts the compose stack (D-11 ports) on the runner.
      - name: pnpm run ci
        run: pnpm run ci

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Save Playwright browsers
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Stack status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            **/playwright-report/
            **/test-results/
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7

  swift:
    name: Swift sidecar (macOS)
    # Xcode 26 / Swift 6.2 (native/oat-audio/README.md). Synthetic capture only: no audio hardware, no
    # permission prompts.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # scripts/ci.mjs and check-frames.mjs are dependency-free Node: no pnpm install needed. setup-node v5
      # turns on the pnpm cache from `packageManager` by default, which fails without pnpm on PATH.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: swift build + test + synthetic capture
        run: node scripts/ci.mjs --only swift
