# Hosted CI (D-42): `pnpm run ci --fast` split across parallel jobs for PRs, pushes to main and manual runs.
# Run the full gate locally with `pnpm run ci`, or the macOS sidecar checks with `pnpm run ci --only swift`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # The 4-vCPU runner is several times slower than a dev machine: stretch timeouts, never the waits.
  OAT_TEST_TIMEOUT_SCALE: '3'

jobs:
  fast:
    name: Fast (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Balanced by cold-cache timings: typecheck and unit tests are ~60-75 s each, the rest ~50 s together.
      matrix:
        include:
          - name: format, actionlint, lint
            key: static
            steps: format,actionlint,lint
          - name: typecheck
            key: typecheck
            steps: typecheck
          - name: unit tests
            key: test
            steps: test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.key }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.key }}-

      - name: pnpm run ci --only ${{ matrix.steps }}
        run: pnpm run ci --only ${{ matrix.steps }}

      - name: Save turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
