# Oat local dev stack (D-11). Use the root scripts: `pnpm dev:up | dev:build | dev:down | dev:reset | dev:logs | dev:ps`,
# and `pnpm dev:app | dev:app:stop` for the web app itself (profile `app`).
# Host ports are in a private range so they don't clash with other local stacks, and bind to 127.0.0.1 only.
# The project name is fixed, so every git worktree shares this one stack. Nothing is bind-mounted from the
# repo (config is baked into small images), so the stack keeps working after the worktree that built it is gone.
name: oat

services:
  postgres:
    # Stands in for Neon (prod).
    # pgvector/pgvector:0.8.7-pg17 + docker/postgres/init (enables vector + pg_trgm).
    build: ./docker/postgres
    image: oat-postgres:dev
    environment:
      POSTGRES_DB: oat
      POSTGRES_USER: oat
      POSTGRES_PASSWORD: oat
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: TCP, so the temporary init-time server (socket only) doesn't count as ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U oat -d oat']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  redis:
    # Stands in for Upstash/managed Redis (queues, rate limits, pub/sub).
    image: redis:7.4.12-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:63790:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    # Stands in for transactional email (magic links, invites). SMTP :11025, web UI + API :18025.
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  oauth:
    # Stands in for Google OAuth/OIDC. Issuer: http://localhost:18089/google (any client id/secret works).
    # ghcr.io/navikt/mock-oauth2-server:7.0.0 + docker/oauth/{config.json,login.html}.
    build: ./docker/oauth
    image: oat-oauth:dev
    ports:
      - '127.0.0.1:18089:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/isalive']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  mocks:
    # Stands in for AI Gateway (LLM + embeddings), Deepgram, Notion, Google Calendar. See tools/mocks.
    build:
      context: .
      dockerfile: tools/mocks/Dockerfile
    image: oat-mocks:dev
    ports:
      - '127.0.0.1:14010:14010'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:14010/health']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # --- profile `app`: the web app itself in containers (1.9) + the index worker (6.1). `pnpm dev:app` builds
  # these images from the current checkout and starts them; plain `pnpm dev:up` leaves them out. ------------

  migrate:
    # One-shot: applies @oat/db migrations from this checkout to the compose database, then exits 0.
    # `web` starts only after it succeeds. Separate from `web` so the runtime image carries no migration
    # tooling and several web replicas would never race (prod runs migrations as a deploy step too).
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    image: oat-migrate:dev
    environment:
      DATABASE_URL: postgres://oat:oat@postgres:5432/oat
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    # apps/web (Next standalone, node:24-alpine). http://localhost:3000. Stands in for Vercel.
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    image: oat-web:dev
    init: true
    environment:
      # Server-to-server connections use compose service names.
      DATABASE_URL: postgres://oat:oat@postgres:5432/oat
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Oat <no-reply@oat.localhost>
      MAILPIT_URL: http://mailpit:8025
      # Auth (Better Auth). The browser reaches the app at localhost:3000, so that's the public URL that
      # magic links and the Google callback use. The image runs NODE_ENV=production; on a loopback URL
      # @oat/auth accepts the dev secret and plain http (a public URL needs https + a real secret).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-oat-dev-secret-not-for-production-0123456789}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      AUTH_MAX_TEAM_WORKSPACES: ${AUTH_MAX_TEAM_WORKSPACES:-}
      # URLs a browser or the desktop app also uses keep their host form: the entrypoint forwards
      # 127.0.0.1:18089 and :14010 inside the container to oauth and mocks, so the OAuth issuer (which
      # mock-oauth2-server derives from the Host header) and every discovery endpoint match the host's view.
      OAT_LOCALHOST_FORWARDS: 18089=oauth:8080,14010=mocks:14010
      OAUTH_GOOGLE_ISSUER: ${OAUTH_GOOGLE_ISSUER:-http://localhost:18089/google}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-oat-dev}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-oat-dev-secret}
      MOCKS_URL: http://localhost:14010
      # Blank = mocks. Real keys come from the root .env (compose interpolation), like on the host.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_BASE_URL: ${DEEPGRAM_BASE_URL:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      oauth:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  worker:
    # @oat/indexing (6.1): follows change_log and keeps retrieval chunks + embeddings fresh (Redis-backed
    # index queue). `pnpm dev` runs the same worker on the host; both use the shared Redis and the same queue
    # prefix, so they split the work (one change-log follower at a time, under a Redis lock).
    profiles: [app]
    build:
      context: .
      dockerfile: packages/indexing/Dockerfile
    image: oat-worker:dev
    init: true
    environment:
      DATABASE_URL: postgres://oat:oat@postgres:5432/oat
      REDIS_URL: redis://redis:6379
      # Embeddings: the mock LLM service unless a real AI Gateway key is set in the root .env.
      MOCKS_URL: http://mocks:14010
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL_EMBED: ${AI_MODEL_EMBED:-}
      OAT_INDEX_QUEUE_PREFIX: ${OAT_INDEX_QUEUE_PREFIX:-}
      OAT_INDEX_DEBOUNCE_MS: ${OAT_INDEX_DEBOUNCE_MS:-}
      OAT_INDEX_CONCURRENCY: ${OAT_INDEX_CONCURRENCY:-}
      OAT_INDEX_MAX_CHUNKS: ${OAT_INDEX_MAX_CHUNKS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mocks:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
